:root{--navy:#061629;--ink:#0E2238;--glass:rgba(7,24,43,.84);--line:rgba(255,255,255,.3);--text:#FFFFFF;--muted:#CBD7E3;--or:#EA721A;--or2:#F9A866;--ok:#45D088;--bad:#FF8388;--blue:#00619B;--green:#01853A}
*{box-sizing:border-box}
html{background:var(--navy)}
html,body{margin:0;color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
body::before{content:'';position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;background:linear-gradient(rgba(6,22,41,.5),rgba(6,22,41,.25) 45%,rgba(6,22,41,.7)),var(--bgimg) center 80%/cover no-repeat,var(--navy)}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:7px;z-index:3;background:linear-gradient(90deg,var(--blue) 0 33.33%,var(--green) 33.33% 66.66%,var(--or) 66.66%)}
#app{max-width:500px;margin:0 auto;padding:22px 16px 46px}
#app.wide{max-width:1240px;padding:30px 36px 56px}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0;font-weight:700}
h2{font-size:24px;line-height:1.25}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.ev{font-family:Poppins,sans-serif;line-height:1}
.ev span{display:block;font-size:14px;letter-spacing:.5px}
.ev b{display:block;font-weight:800;font-size:34px;letter-spacing:.5px;margin-top:2px}
.tag{font-family:Poppins,sans-serif;font-weight:600;font-size:13px;background:#FFFFFF;color:var(--ink);border-radius:999px;padding:6px 13px;white-space:nowrap}
.game{display:inline-flex;align-items:center;gap:9px;border:1.5px solid #FFFFFF;border-radius:999px;padding:7px 15px;margin:10px 0 18px;font-family:Poppins,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:2.5px;background:rgba(6,22,41,.55)}
.game i{width:9px;height:9px;border-radius:50%;background:var(--or);flex:none}
.game em{font-style:normal;font-weight:500;letter-spacing:.3px;color:var(--muted)}
.card{background:var(--glass);border:1.5px solid var(--line);border-radius:22px;padding:22px 20px;margin-bottom:14px}
.card.hl{border-color:#FFFFFF}
.kicker{font-family:Poppins,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:2.5px;color:var(--or2);text-transform:uppercase;margin-bottom:8px}
.big{font-family:Poppins,sans-serif;font-weight:700;font-size:28px;line-height:1.2}
.clue{font-family:Poppins,sans-serif;font-weight:600;font-size:24px;line-height:1.3;margin:8px 0 6px;padding-left:14px;border-left:3px solid var(--or)}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
p{line-height:1.5;margin:8px 0}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#FFFFFF;border:2px solid #FFFFFF;border-radius:14px;padding:13px 15px;outline:none}
input::placeholder,textarea::placeholder{color:#7F8FA0}
input:focus,textarea:focus{border-color:var(--or)}
input:disabled{opacity:.5}
input.code{font-family:Poppins,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px}
textarea{min-height:88px;resize:vertical}
button{font-family:Poppins,sans-serif;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;min-height:50px;background:var(--or);color:#1A0E03;width:100%;margin-top:12px}
button.sec{background:transparent;color:#FFFFFF;border:1.5px solid var(--line);font-weight:600}
button.link{background:none;color:var(--muted);width:auto;min-height:44px;padding:8px 4px;font-family:Inter,sans-serif;font-weight:500;font-size:14px;text-decoration:underline;margin-top:6px;border-radius:8px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
.stages{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 16px}
.stages::before{content:'';position:absolute;left:12.5%;right:12.5%;top:16px;height:2px;background:var(--line)}
.st{position:relative;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.st i{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:0 auto 6px;border-radius:50%;font-style:normal;font-family:Poppins,sans-serif;font-weight:700;font-size:15px;background:var(--ink);border:2px solid var(--line);color:var(--muted)}
.st.done i{background:#FFFFFF;border-color:#FFFFFF;color:var(--ink)}
.st.now i{background:var(--or);border-color:var(--or);color:#1A0E03}
.st.now,.st.done{color:#FFFFFF}
.flash{border-radius:16px;padding:12px 16px;margin-bottom:12px;font-weight:600;font-size:15px;background:var(--glass);border:1.5px solid var(--line)}
.flash.ok{border-color:var(--ok)}.flash.bad{border-color:var(--bad)}.flash.info{border-color:#FFFFFF}
.lock{display:flex;align-items:center;gap:14px;background:var(--glass);border:1.5px solid var(--bad);border-radius:18px;padding:14px 18px;margin-bottom:14px}
.lock .t{font-family:Poppins,sans-serif;font-size:32px;font-weight:800;color:var(--bad);min-width:66px}
.opt{display:block;text-align:left;background:#FFFFFF;color:var(--ink);border-radius:14px;font-family:Inter,sans-serif;font-weight:600;margin-top:10px;padding:14px 16px}
.word{font-family:Poppins,sans-serif;font-weight:800;letter-spacing:3px;color:#FFFFFF}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 4px 0;font-size:13px;font-weight:600;color:#FFFFFF;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.res{text-align:center;padding:34px 20px}
.res .ic{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FFFFFF}
.res.ok .ic{color:#01853A}.res.bad .ic{color:#D2353B}.res.info .ic{color:var(--blue)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--or);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hero404{font-family:Poppins,sans-serif;font-weight:800;font-size:76px;line-height:1;color:#FFFFFF;letter-spacing:2px}
.hero404 span{color:var(--or)}
.logos{display:flex;align-items:center;justify-content:center;gap:12px;background:#FFFFFF;border-radius:18px;padding:12px 14px;margin:22px auto 0;max-width:468px}
.logos img{display:block;width:auto}
.logos s{width:1px;height:30px;background:#C4CBD1;flex:none}
/* ranking */
.rk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:6px 0 24px}
.rk-title{font-family:Poppins,sans-serif;font-weight:800;font-size:64px;line-height:1}
.rk-title span{color:var(--or)}
.rk-sub{font-size:19px;color:#FFFFFF;margin-top:8px}
.rk-stat{text-align:right;font-family:Poppins,sans-serif;font-size:15px}
.rk-stat b{display:block;font-size:46px;line-height:1}
.rk-row{display:grid;grid-template-columns:70px 1fr 170px 38%;align-items:center;gap:18px;background:var(--glass);border:1.5px solid var(--line);border-radius:18px;padding:13px 22px;margin-bottom:10px}
.rk-row.win{border-color:var(--or);border-width:2.5px}
.rk-pos{font-family:Poppins,sans-serif;font-weight:800;font-size:28px;color:var(--muted)}
.rk-row.win .rk-pos{color:var(--or2)}
.rk-name{font-family:Poppins,sans-serif;font-weight:600;font-size:24px}
.rk-stage{font-family:Poppins,sans-serif;font-weight:600;font-size:14px;letter-spacing:1px;color:var(--muted)}
.bar{height:14px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or);border-radius:999px;transition:width .6s}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:end;margin:10px 0 26px}
.pd{background:var(--glass);border:1.5px solid var(--line);border-radius:22px;text-align:center;padding:20px 12px}
.pd .n{font-family:Poppins,sans-serif;font-weight:700;font-size:26px}
.pd .p{font-family:Poppins,sans-serif;font-size:46px;font-weight:800;color:var(--or2)}
.pd.first{border-color:#FFFFFF;border-width:2.5px;padding:36px 12px}
.pd.first .n{font-size:34px}
/* admin */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:1px}
td button{width:auto;min-height:38px;padding:6px 13px;font-size:13px;margin:0 4px 4px 0}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;border:1.5px solid var(--line)}
.pill.on{border-color:var(--ok);color:var(--ok)}.pill.off{color:var(--muted)}.pill.x{border-color:var(--bad);color:var(--bad)}
.codebox{font-family:Poppins,sans-serif;font-weight:800;font-size:58px;letter-spacing:10px;color:#FFFFFF;text-align:center;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qrbox{background:#FFFFFF;border-radius:18px;padding:14px;width:280px;max-width:100%;margin:10px auto}
.qrbox svg{display:block;width:100%;height:auto}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.rk-row{grid-template-columns:48px 1fr}.rk-row .bar,.rk-row .rk-stage{grid-column:2}.rk-title{font-size:40px}}
</style>
</head>

      } else if (m.stage === 4) {
        h += '<div class="card hl"><div class="kicker">Deploy · último paso</div><h2>¡Corre a la mesa de control!</h2><p class="muted">Allí te darán el código final. El primero en ingresarlo gana.</p>' +
          '<form id="fz"><input id="zi" class="code" placeholder="CÓDIGO" maxlength="6" autocomplete="off" aria-label="Código final"' + dis + '><button type="submit"' + dis + '>Enviar código</button></form></div>';
      }
      if (m.stage <= 2) h += wordCard(m);
    }
    h += '<div class="foot"><span>' + esc(m.name) + ' · ' + esc(m.badge) + '</span><span>' + (d.status === 'juego' && m.pos ? 'Vas #' + m.pos + ' de ' + d.players : '') + '</span></div>';
    render(h);
    bindPlayer();
    if (locked) {
      if (ST.tick) clearInterval(ST.tick);
      ST.tick = setInterval(function () {
        var left = Math.ceil((m.lockUntil + skew - Date.now()) / 1000), el = document.getElementById('lk');
        if (left <= 0) { clearInterval(ST.tick); ST.tick = null; m.lockUntil = 0; playerRender(); } else if (el) el.textContent = left + 's';
      }, 500);
    }
  }

  function wordCard(m) {
    return '<div class="card"><div class="kicker">Tu palabra clave</div><div class="word" style="font-size:26px">' + esc(m.word) + '</div>' +
      '<p class="small muted">No la muestres. Dásela solo a quien te encuentre y te la pida en la etapa Handshake.</p></div>';
  }

  function act(action, extra) {
    var me = getMe(); if (!me || ST.busy) return; ST.busy = true;
    var a = { badge: me.badge, token: me.token }; for (var k in extra) a[k] = extra[k];
    call(action, a).then(function (d) {
      ST.busy = false;
      if (!d.ok) { ST.flash = { kind: 'bad', text: d.msg || 'Error' }; return playerRender(); }
      var r = d.result || {};
      if (r.ok === false) ST.flash = { kind: 'bad', text: r.msg };
      else if (r.result === 'encontrado') ST.flash = { kind: 'ok', text: '¡Correcto! Era ' + r.name + '.' };
      else if (r.result === 'pide_palabra') ST.flash = { kind: 'ok', text: '¡Es ' + r.name + '! Pídele su palabra clave.' };
      else if (r.result === 'etapa3') ST.flash = { kind: 'ok', text: 'Handshake completo. Entraste a Debug.' };
      else if (r.result === 'correcta') ST.flash = { kind: 'ok', text: 'Correcto. Siguiente pregunta.' };
      else if (r.result === 'etapa4') ST.flash = { kind: 'ok', text: 'Debug superado. ¡Corre a la mesa de control!' };
      else if (r.result === 'saltada') ST.flash = { kind: 'info', text: 'Pista cambiada. Tienes 60 s de penalización.' };
      ST.data = d; ST.sig = null; playerRender();
    });
  }

  function bindPlayer() {
    var f = document.getElementById('ff'); if (f) f.onsubmit = function (e) { e.preventDefault(); var v = document.getElementById('fc').value; if (v.trim()) act('find', { target: v }); };
    var s = document.getElementById('skip'); if (s) s.onclick = function () { act('skip', {}); };
    var w = document.getElementById('fw'); if (w) w.onsubmit = function (e) { e.preventDefault(); var v = document.getElementById('wi').value; if (v.trim()) act('word', { word: v }); };
    var z = document.getElementById('fz'); if (z) z.onsubmit = function (e) { e.preventDefault(); var v = document.getElementById('zi').value; if (v.trim()) act('final', { code: v }); };
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) { b.onclick = function () { act('answer', { option: Number(b.getAttribute('data-o')) }); }; });
  }

  // ================= Ranking (pantalla proyectada) =================
  function rankingStart() {
    loading('Cargando ranking…');
    poll(function () { call('ranking').then(function (d) { if (d.ok) rankingRender(d); }); }, 4000);
  }

  function stageLabel(r) { return r.finishedAt ? 'COMPLETADO' : r.stage >= 1 && r.stage <= 4 ? '0' + r.stage + ' ' + STAGES[r.stage - 1].toUpperCase() : 'EN ESPERA'; }

  function rankingRender(d) {
    var rk = d.ranking, fin = rk.filter(function (r) { return r.finishedAt; });
    var h = '<div class="rk-head"><div><div class="ev"><span>IEEE Ecuador</span><b>CONNECT</b></div><div class="rk-title" style="margin-top:14px">ERROR <span>404</span></div><div class="rk-sub">Regalo no encontrado</div></div>' +
      '<div class="rk-stat"><b>' + d.active + '</b>jugadores' + (d.status === 'juego' ? ' · ' + fin.length + ' completaron' : '') + '</div></div>';
    if (d.status === 'espera') {
      h += '<div class="card center" style="padding:40px"><div class="hero404" style="font-size:110px">4<span>0</span>4</div><h2 style="font-size:34px;margin-top:16px">El juego está por empezar</h2>' +
        '<p class="muted" style="font-size:20px">Escanea el QR de tu gafete para activarte. Ya hay ' + d.active + ' jugadores listos.</p></div>';
      h += rk.length ? '<p class="muted" style="font-size:18px">' + rk.map(function (r) { return esc(r.name); }).join(' · ') + '</p>' : '';
    } else {
      if (d.status === 'fin') {
        var top = fin.slice(0, 3);
        if (top.length) {
          var order = [top[1], top[0], top[2]];
          h += '<div class="podium">' + order.map(function (r, i) {
            if (!r) return '<div></div>';
            return '<div class="pd ' + (r.pos === 1 ? 'first' : '') + '"><div class="p">#' + r.pos + '</div><div class="n">' + esc(r.name) + '</div></div>';
          }).join('') + '</div>';
        }
        h += '<h2 style="margin:6px 0 14px;font-size:24px">Orden para elegir regalo</h2>';
      }
      h += rk.map(function (r) {
        return '<div class="rk-row ' + (r.finishedAt && r.pos === 1 ? 'win' : '') + '"><div class="rk-pos">#' + r.pos + '</div><div class="rk-name">' + esc(r.name) + '</div>' +
          '<div class="rk-stage">' + stageLabel(r) + '</div><div class="bar"><i style="width:' + r.progress + '%"></i></div></div>';
      }).join('');
    }
    render(h, true);
  }

  // ================= Panel de organizador =================
  function adminStart() {
    if (!ST.adminKey) return adminLogin();
    loading('Abriendo panel…');
    poll(adminLoad, 5000);
  }
  function adminLogin(err) {
    render(brand('ORGANIZADOR') + (err ? '<div class="flash bad">' + esc(err) + '</div>' : '') +
      '<div class="card"><h2>Panel de organizador</h2><form id="fk"><label for="ki">Clave</label><input id="ki" type="password" autocomplete="off"><button type="submit">Entrar</button></form></div>');
    document.getElementById('fk').onsubmit = function (e) { e.preventDefault(); ST.adminKey = document.getElementById('ki').value; adminStart(); };
  }
  function adminLoad() {
    if (ST.adminEdit || ST.busy) return;
    call('adminView', { key: ST.adminKey }).then(function (d) {
      if (d.error === 'key') { stop(); ST.adminKey = ''; return adminLogin(d.msg); }
      if (d.ok) adminRender(d);
    });
  }
  function adminCmd(cmd, extra) {
    if (ST.busy) return; ST.busy = true;
    var a = { key: ST.adminKey, cmd: cmd }; for (var k in extra) a[k] = extra[k];
    call('admin', a).then(function (d) {
      ST.busy = false; ST.adminEdit = null;
      if (d.result && d.result.ok === false) ST.flash = { kind: 'bad', text: d.result.msg };
      if (d.ok) adminRender(d);
    });
  }
  function adminRender(d) {
    var act = d.players.filter(function (p) { return p.active && !p.excluded; }).length;
    var stLbl = { espera: 'En espera', juego: 'En juego', fin: 'Terminado' }[d.status];
    var h = brand('ORGANIZADOR') + flashHtml();
    h += '<div class="grid2"><div class="card"><div class="kicker">Estado</div><div class="big">' + stLbl + '</div><p class="muted">' + act + ' jugadores activos</p>' +
      (d.status === 'espera' ? '<button data-c="start">Iniciar juego</button>' : '') +
      (d.status === 'juego' ? '<button data-c="end" class="sec">Terminar juego</button>' : '') +
      (d.status === 'fin' ? '<button data-c="resume" class="sec">Reanudar juego</button>' : '') +
      '<button class="sec" id="rst">' + (ST.resetArm ? 'Toca otra vez para borrar TODO' : 'Reiniciar todo (para pruebas)') + '</button></div>' +
      '<div class="card"><div class="kicker">Código final (mesa de control)</div><div class="codebox">' + esc(d.finalCode) + '</div>' +
      '<p class="small muted center">Dalo solo a quien llegue en la etapa Deploy.</p><button class="sec" data-c="newcode">Generar otro código</button></div></div>';
    if (ST.adminQr && window.qrcode && window.APP_URL) {
      var url = APP_URL + '?g=' + ST.adminQr, q = qrcode(0, 'L'); q.addData(url); q.make();
      h += '<div class="card hl center"><div class="kicker">QR de prueba · ' + ST.adminQr + '</div><div class="qrbox">' + q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + '</div>' +
        '<p class="small muted">Escanéalo con la cámara del celular. Es el mismo enlace que irá impreso en el gafete ' + ST.adminQr + '.</p><button class="sec" id="qrx" style="width:auto">Cerrar QR</button></div>';
    }
    h += '<div class="card" style="overflow-x:auto"><div class="kicker">Gafetes</div><table><thead><tr><th>Gafete</th><th>Persona</th><th>Estado</th><th>Dato curioso</th><th></th></tr></thead><tbody>' +
      d.players.map(function (p) {
        var pill = p.excluded ? '<span class="pill x">Fuera</span>' : p.active ? '<span class="pill on">' + (p.finishedAt ? 'Terminó' : p.stage ? 'Etapa ' + p.stage + ' · ' + p.progress + '%' : 'Activo') + '</span>' : '<span class="pill off">Sin activar</span>';
        var edit = ST.adminEdit === p.badge;
        return '<tr><td><b>' + p.badge + '</b></td><td>' + esc(p.name || '(en blanco)') + (p.word ? '<div class="small muted">' + esc(p.word) + '</div>' : '') + '</td><td>' + pill + (p.penalties ? '<div class="small muted">' + p.penalties + ' penal.</div>' : '') + '</td>' +
          '<td>' + (edit ? '<textarea id="ef">' + esc(p.fact) + '</textarea><button data-save="' + p.badge + '">Guardar</button><button class="sec" data-cancel="1">Cancelar</button>' : esc(p.fact || '-')) + '</td>' +
          '<td>' + (edit ? '' : (window.qrcode && window.APP_URL ? '<button class="sec" data-qr="' + p.badge + '">Ver QR</button>' : '') + '<button class="sec" data-edit="' + p.badge + '">Editar dato</button>' +
            (p.active ? (p.excluded ? '<button class="sec" data-c="include" data-b="' + p.badge + '">Incluir</button>' : '<button class="sec" data-c="exclude" data-b="' + p.badge + '">Sacar</button>') + '<button class="sec" data-c="release" data-b="' + p.badge + '">Liberar</button>' : '')) + '</td></tr>';
      }).join('') + '</tbody></table><button class="sec" data-c="addbadge" style="width:auto">Agregar gafete extra</button></div>';
    if (window.APP_URL) h += '<div class="card small muted">Pantalla para proyectar: <a href="' + esc(APP_URL) + '?v=ranking" style="color:var(--blue)">' + esc(APP_URL) + '?v=ranking</a></div>';
    render(h, true);
    Array.prototype.forEach.call(document.querySelectorAll('[data-c]'), function (b) { b.onclick = function () { adminCmd(b.getAttribute('data-c'), { badge: b.getAttribute('data-b') }); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) { b.onclick = function () { ST.adminEdit = b.getAttribute('data-edit'); adminRender(d); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-qr]'), function (b) { b.onclick = function () { ST.adminQr = b.getAttribute('data-qr'); adminRender(d); window.scrollTo(0, 0); }; });
    var qx = document.getElementById('qrx'); if (qx) qx.onclick = function () { ST.adminQr = null; adminRender(d); };
    var sv = document.querySelector('[data-save]'); if (sv) sv.onclick = function () { adminCmd('fact', { badge: sv.getAttribute('data-save'), fact: document.getElementById('ef').value }); };
    var cc = document.querySelector('[data-cancel]'); if (cc) cc.onclick = function () { ST.adminEdit = null; adminRender(d); };
    document.getElementById('rst').onclick = function () {
      if (!ST.resetArm) { ST.resetArm = true; adminRender(d); setTimeout(function () { ST.resetArm = false; }, 5000); return; }
      ST.resetArm = false; adminCmd('reset', {});
    };
  }

  window.E404UI = { route: route, stop: stop };
  route();
})();
</script>
</body>
</html>
